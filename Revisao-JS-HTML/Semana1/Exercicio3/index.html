<!DOCTYPE html>

<head>

    <title>Exercício 3: Calculadora de Dano em Jogo RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo de RPG</h1>
        <h2>Calculadora de Dano</h2>

        <table>
            <tbody id="tabela">
            <table>
                <thead>
                    <tr>
                        <th colspan="2" class="titulo">ELEMENTOS</th>
                    </tr>

                        <th class="sub">Atacante</th>
                        <th class="sub">Inimigo</th>
                    </tr>
                </thead>

                <tbody id="tabela-elem">
                    
                </tbody>
            </table>
            <table>
                <thead><tr><th class="titulo">DANO TOTAL</th></tr></thead>
                <tbody id="tabela-dano"></tbody>
            </table>
            </tbody>
        </table>
    </div>
    <script src="exercicio3.js"></script>
